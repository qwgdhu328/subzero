name: SuperFlight
options:
  bundleIdPrefix: com.superflight
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    SWIFT_OBJC_BRIDGING_HEADER: ios/SuperFlight/BridgingHeader.h
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: ios/SuperFlight/Info.plist
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  SuperFlight:
    type: application
    platform: iOS
    sources:
      - path: ios/SuperFlight
          # Shaders.metal compilato automaticamente da XcodeGen (fonte .metal)
      - path: native/engine
        createIntermediateGroups: true
        type: group
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superflight.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: ["-lc++"]
        OTHER_CFLAGS: ["-Wno-shorten-64-to-32"]
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../native/engine"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../native/engine"
        GCC_PRECOMPILE_PREFIX_HEADER: "NO"
        SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
schemes:
  SuperFlight:
    build:
      targets:
        SuperFlight: all
    run:
      config: Debug
