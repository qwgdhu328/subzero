name: iOS build

on:
  # Lancio manuale con scelta firma
  workflow_dispatch:
    inputs:
      sign_ios:
        description: "Firma iOS (richiede secrets)"
        type: boolean
        default: false

  # Riutilizzabile da altri repo/workflow
  workflow_call:
    inputs:
      sign_ios:
        description: "Firma iOS (richiede secrets)"
        type: boolean
        required: false
        default: false
    secrets:
      APPLE_CERT_P12_BASE64:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_PROVISION_BASE64:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "app/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Resolve Xcode scheme
        run: |
          SCHEME=$(xcodebuild -list -workspace ios/*.xcworkspace -json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log((j.workspace||j.project).schemes[0])});")
          echo "SCHEME_NAME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      # 1) .app per il simulatore — nessuna firma coinvolta
      - name: Build simulator .app (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | xcpretty || exit 1

      - name: Zip simulator .app
        run: |
          set -euo pipefail
          mkdir -p out
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in build products"
            find build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          echo "Zipping: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "out/subzero-simulator.zip"

      # 2) Build device unsigned
      - name: Build device app (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee -a build.log | xcpretty || exit 1

      # 3a) Firma opzionale con certificato dai secrets
      - name: Import certificate and sign (optional)
        if: inputs.sign_ios == true
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-keychain' }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$APPLE_PROVISION_BASE64" | base64 --decode -o "$PROFILE_PATH"

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin \
            <<< "$(security cms -D -i "$PROFILE_PATH")")
          ENTITLEMENTS=$RUNNER_TEMP/entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements' /dev/stdin \
            <<< "$(security cms -D -i "$PROFILE_PATH")" > "$ENTITLEMENTS"

          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$UUID.mobileprovision"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m1 "iPhone Distribution\|Apple Distribution\|iPhone Developer\|Apple Development" | sed -E 's/.*"(.*)"/\1/')
          echo "Signing with identity: $IDENTITY"

          # Firma prima framework e dylib, poi l'app
          find "$APP_PATH" -name "*.framework" -o -name "*.dylib" | while read -r fw; do
            /usr/bin/codesign --force --sign "$IDENTITY" "$fw" || true
          done

          /usr/bin/codesign --force --sign "$IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            --generate-entitlement-der \
            "$APP_PATH"

      # 3b) Package IPA unsigned
      - name: Package unsigned IPA
        if: inputs.sign_ios != true
        run: |
          mkdir -p ipa/Payload out
          cp -R build/Build/Products/Release-iphoneos/*.app ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent ipa/Payload out/subzero-unsigned.ipa

      # 3c) Package IPA firmata
      - name: Package signed IPA
        if: inputs.sign_ios == true
        run: |
          mkdir -p ipa/Payload out
          cp -R build/Build/Products/Release-iphoneos/*.app ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent ipa/Payload out/subzero-signed.ipa

      - name: Verify signature (signed only)
        if: inputs.sign_ios == true
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          codesign -vvv "$APP_PATH"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.sign_ios == true && 'signed' || 'unsigned' }}
          path: |
            out/subzero-simulator.zip
            out/subzero-*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
